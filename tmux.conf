# tmux 설정 — Catppuccin(Mocha) + Claude Code 세션 상태 동그라미
# https://github.com/sglim/tmux · 설치: ./install.sh

# 0 is too far from ` 😉
set -g base-index 1

# window 중간이 닫혀도 1,2,3... 으로 자동 재정렬
set -g renumber-windows on

# prefix
unbind C-b                                  # 기본 키 바인딩 제거

set-option -g prefix C-a                    # 기본 키 바인딩 Ctrl-a 로 설정
bind-key C-a send-prefix

# split panes using | and -
bind | split-window -h                      # 수평분할 키 바인딩
bind - split-window -v                      # 수직분할 키 바인딩

unbind '"'
unbind %

# Enable mouse control
set -g mouse on                             # 마우스 사용
bind C-c run "tmux save-buffer - | pbcopy"  # Ctrl-C로 복사

# ============================================================
# 클립보드 — 드래그 = macOS pbcopy 자동 동기화
# ============================================================
set -g set-clipboard on                     # OSC 52 (terminal escape 로 클립보드 push)

# 드래그 끝나면 자동으로 pbcopy + selection 유지
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key -T copy-mode    MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# vi copy mode 의 'y' 도 pbcopy 로
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# 더블클릭/트리플클릭 선택 후 자동 pbcopy
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word     \; send-keys -X copy-pipe-no-clear "pbcopy"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line     \; send-keys -X copy-pipe-no-clear "pbcopy"

set -g status-keys vi
set -g history-limit 10000

setw -g mode-keys vi
setw -g monitor-activity on

bind-key J resize-pane -D 5
bind-key K resize-pane -U 5
bind-key H resize-pane -L 5
bind-key L resize-pane -R 5

bind-key M-j resize-pane -D
bind-key M-k resize-pane -U
bind-key M-h resize-pane -L
bind-key M-l resize-pane -R

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# 위에 synchronize-panes 을 (ctrl + B y)라는 옵션으로 사용할 수 있게 함.
bind-key y set-window-option synchronize-panes

# Use Alt-vim keys without prefix key to switch panes
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Alt+Arrow → pane 이동 (prefix 없이)
# (cmd+option+Arrow 는 iTerm2 내장 split navigation 과 충돌해 포기)
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# 현재 window 를 좌/우로 한 칸씩 이동 (prefix + < / >). -r 은 repeat — 연타 가능.
# -d 제거 → swap 후 focus 가 옮긴 window 를 따라감 → 같은 window 를 계속 이동 가능.
bind -r "<" swap-window -t -1\; select-window -t -1
bind -r ">" swap-window -t +1\; select-window -t +1

# No delay for escape key press
set -sg escape-time 0

# Terminal
set -ga terminal-overrides ",xterm:Tc"      # 터미널 설정

# Reload tmux config
bind r source-file ~/.tmux.conf

# THEME — Catppuccin (Mocha) 가 plugin 으로 status bar 전체 처리
# 기존 status-left/right 는 catppuccin 모듈로 대체 (아래 plugins 섹션 참조)
set -g status-interval 5

# ============================================================
# Plugins (TPM) — 세션 저장/복원
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'

# ----- System status -----
set -g @plugin 'tmux-plugins/tmux-cpu'        # CPU + RAM 사용률
set -g @plugin 'tmux-plugins/tmux-battery'    # 배터리 상태

# ----- Theme: Catppuccin (Mocha) -----
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'mocha'                              # mocha | latte | frappe | macchiato

# status bar 구성
set -g @catppuccin_window_status_style "rounded"
# window_name (#W) 표시 — automatic-rename 이 디렉토리로 자동 설정,
# 수동 rename 시 tmux 가 그 window 의 automatic-rename 을 off 로 전환해 보존
set -g @catppuccin_window_text "#W#{E:@claude_dots}"
set -g @catppuccin_window_current_text "#W#{E:@claude_dots}"
set -g @catppuccin_window_default_text "#W#{E:@claude_dots}"
# Claude 에이전트 상태 동그라미 — 창 이름 뒤에 pane 마다 ○초록 대기 · ●초록 끝났는데 안 봄 · ●노랑 작업 중 · ●빨강 내 답 기다림.
# pane 옵션 @claude_state 는 Claude 훅(~/.local/bin/claude-tmux-state)이 적는다.
set -g @claude_dots '#{?#{P:#{@claude_state}}, ,}#{P:#{?#{==:#{@claude_state},working},#[fg=#{@thm_yellow}]●#[fg=#{@thm_fg}],#{?#{==:#{@claude_state},blocked},#[fg=#{@thm_red}]●#[fg=#{@thm_fg}],#{?#{==:#{@claude_state},idle},#[fg=#{@thm_green}]○#[fg=#{@thm_fg}],#{?#{==:#{@claude_state},done},#[fg=#{@thm_green}]●#[fg=#{@thm_fg}],}}}}}'
# pane_title (#T) 이 hostname 으로 설정되는 것 차단
set -g set-titles off

# ----- Pane Border Title + iTerm2 Badge (watermark) 통합 -----
# 각 pane 상단 경계선에 label 표시
set -g pane-border-status top
# 제목 옆 마크는 Claude 상태(@claude_state)를 따른다: idle ○초록, working·done·blocked 는 제목 줄을 노랑·초록·빨강 띠로.
# Claude 가 없는 pane 은 파랑 ●.
# 띠 뒤의 「43%」 는 컨텍스트가 찬 정도(@claude_ctx, ~/.local/bin/claude-statusline 이 적는다) — 70%·85% 에서 테마의 노랑·빨강.
set -g pane-border-format ' #{?pane_title,#{?#{==:#{@claude_state},done},#[bg=#{@thm_green} fg=#{@thm_crust} bold] ● #{pane_title} #[default],#{?#{==:#{@claude_state},blocked},#[bg=#{@thm_red} fg=#{@thm_crust} bold] ● #{pane_title} #[default],#{?#{==:#{@claude_state},working},#[bg=#{@thm_yellow} fg=#{@thm_crust} bold] ● #{pane_title} #[default],#{?#{==:#{@claude_state},idle},#[fg=#{@thm_green}]○#[default] #{pane_title},#[fg=#{@thm_blue}]●#[default] #{pane_title}}}}},#[fg=#6c7086]── #{pane_current_command}}#{?#{@claude_ctx}, #{?#{e|>=:#{@claude_ctx},85},#[fg=#{@thm_red}],#{?#{e|>=:#{@claude_ctx},70},#[fg=#{@thm_yellow}],#[fg=#{@thm_green}]}}#{@claude_ctx}%%#[default],} '
# done·blocked pane 의 배경(~/.local/bin/claude-tmux-state 가 pane 의 window-style 로 칠한다).
set -g @claude_tint_done 'bg=#1e2b26'
set -g @claude_tint_blocked 'bg=#2e1e26'
# tmux 가 unknown escape 를 통과시켜 iTerm2 로 전달하게 허용 (tmux 3.3+)
set -g allow-passthrough on
# Ctrl-a + B : pane title 설정 + iTerm2 badge (watermark) 동기화
# wrapper script 가 처리 — quoted string 안의 %% escape 문제 회피
bind B command-prompt -p "badge:" "run-shell '~/.local/bin/tmux-badge-prompt \"%%\"'"
# Ctrl-a + Alt+B : pane title + iTerm2 badge 제거
bind M-B run-shell '~/.local/bin/tmux-badge-prompt ""'

# Hook: window/pane/session 전환 시 active window 의 @badge 를 iTerm2 에 자동 송신
set-hook -g after-select-window 'run-shell "~/.local/bin/tmux-badge-sync"'
set-hook -g after-select-pane 'run-shell "~/.local/bin/tmux-badge-sync"'
set-hook -g client-session-changed 'run-shell "~/.local/bin/tmux-badge-sync"'
set-hook -g session-window-changed 'run-shell "~/.local/bin/tmux-badge-sync"'

# Extended keys (CSI u) — iTerm2 의 Shift+Enter 등 modified key 를 그대로 통과
# → Claude Code 가 Shift+Enter 를 multi-line 으로 인식
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# 외부 escape 에 의한 rename 차단 (oh-my-zsh 의 hostname 전송 차단)
set -g allow-rename off
# automatic-rename: window_name 을 현재 디렉토리 basename 으로 자동 설정
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'
set -g @catppuccin_status_background "default"
set -g status-position top                                      # 상단 표시

# 좌측: 세션 이름
set -g status-left-length 100
set -g status-left "#{E:@catppuccin_status_session}"

# 우측: Claude 사용량 + CPU + RAM + DISK + host
# Claude 사용량 「#4 14%(4h21m) 80%(2h1m) · 전체 79%」 = 지금 계정 · 5시간 · 주간(괄호는 초기화까지) · 모든 계정 주간 평균.
# ccswitch(https://github.com/sglim/ccswitch) 를 깔았을 때만 보인다(~/.local/bin/tmux-ccswitch). 점검 에이전트가 매분 적는 캐시를 읽기만 한다(API 호출 없음).
# (cpu/battery 는 tmux-cpu 플러그인 제공)
set -g status-right-length 150
# CPU/RAM: tmux-cpu 가 status-right 문자열의 #{cpu_percentage} 를
# 자기 스크립트 호출로 치환한다. 그래서 catppuccin 모듈(#{E:...}) 안이 아니라
# status-right 에 "직접" 써야 동작한다.
# RAM % 뒤의 색점은 macOS 메모리 압력(1 정상/2 경고/4 위험).
# RAM % 는 회수 가능한 캐시까지 포함해 늘 높게 나오므로, "지금 진짜
# 부족한가"는 색점으로 판단한다.
set -g status-right "#(~/.local/bin/tmux-ccswitch)#[fg=#11111b,bg=#f9e2af] CPU #[fg=#cdd6f4,bg=#313244] #{cpu_percentage} #[fg=#11111b,bg=#f9e2af] RAM #[fg=#cdd6f4,bg=#313244] #{ram_percentage} #(~/.local/bin/tmux-mem-pressure) #[fg=#11111b,bg=#f9e2af] DISK #[fg=#cdd6f4,bg=#313244] #(~/.local/bin/tmux-disk-usage) #[fg=#313244,bg=default]"
set -ag status-right "#{E:@catppuccin_status_host}"
set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"


# tmux-resurrect: vim/nvim 세션 + pane 내용까지 복원
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql sqlite3 vim nvim "~claude" "~git" "~yarn dev" "~pnpm dev" "~npm run dev" "~node"'

# tmux-continuum: 자동 저장(5분) + 자동 복원(tmux 시작 시)
set -g @continuum-restore 'on'
set -g @continuum-save-interval '5'

# Initialize TPM (반드시 맨 마지막)
run '~/.tmux/plugins/tpm/tpm'

# 선택된 pane 의 done(●초록)을 idle(○)로(창을 옮기면 그 창의 선택된 pane, pane 을 옮기면 옮겨 간 pane). 고정 번호 [42] — 다시 읽어도 안 겹치고 [0] 의 badge-sync 도 안 덮는다.
# 🔴 파일 맨 끝에 둔다: 번호 없는 set-hook(위 badge-sync)은 그 훅 목록을 통째로 비운 뒤 [0] 에 넣는다.
set-hook -g session-window-changed[42] 'run-shell -b "$HOME/.local/bin/claude-tmux-state seen #{pane_id}"'
set-hook -g client-session-changed[42] 'run-shell -b "$HOME/.local/bin/claude-tmux-state seen #{pane_id}"'
set-hook -g after-select-pane[42] 'run-shell -b "$HOME/.local/bin/claude-tmux-state seen #{pane_id}"'
