<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-label="A mock of the tmux screen. The tab bar shows window 1 with a hollow green and a filled green dot, window 2 with a red dot, window 3 with a yellow dot. The left pane has a green title strip and a tinted background, the top right pane shows a hollow green dot, the bottom right pane a blue dot.">
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
  </style>
  <defs>
    <clipPath id="term"><rect x="10" y="10" width="700" height="280" rx="10"/></clipPath>
  </defs>
  <g clip-path="url(#term)">
    <rect x="10" y="10" width="700" height="280" fill="#282828"/>
    <!-- status bar -->
    <rect x="10" y="10" width="700" height="28" fill="#32302f"/>
    <rect x="20" y="16" width="52" height="16" rx="8" fill="#83a598"/>
    <text class="mono" x="46" y="28" text-anchor="middle" fill="#282828" font-weight="600">main</text>
    <rect x="82" y="16" width="88" height="16" rx="8" fill="#504945"/>
    <text class="mono" x="92" y="28" fill="#ebdbb2">1 blog</text>
    <circle cx="146" cy="24" r="4.5" fill="#b8bb26"/>
    <circle cx="158" cy="24" r="4" fill="none" stroke="#b8bb26" stroke-width="1.6"/>
    <text class="mono" x="186" y="28" fill="#a89984">2 bots</text>
    <circle cx="238" cy="24" r="4.5" fill="#fb4934"/>
    <text class="mono" x="258" y="28" fill="#a89984">3 notes</text>
    <circle cx="318" cy="24" r="4.5" fill="#fabd2f"/>
    <text class="mono" x="338" y="28" fill="#a89984">4 shell</text>

    <!-- left pane: done, tinted -->
    <rect x="10" y="38" width="360" height="252" fill="#1e2b1e"/>
    <line x1="10" y1="54" x2="370" y2="54" stroke="#504945"/>
    <rect x="20" y="46" width="88" height="16" rx="2" fill="#b8bb26"/>
    <text class="mono" x="26" y="58" fill="#282828" font-weight="600">● claude</text>
    <rect x="24" y="76" width="220" height="6" rx="3" fill="#3c4a33"/>
    <rect x="24" y="92" width="290" height="6" rx="3" fill="#3c4a33"/>
    <rect x="24" y="108" width="180" height="6" rx="3" fill="#3c4a33"/>
    <rect x="24" y="132" width="250" height="6" rx="3" fill="#3c4a33"/>
    <rect x="24" y="148" width="140" height="6" rx="3" fill="#3c4a33"/>
    <rect x="24" y="172" width="300" height="6" rx="3" fill="#3c4a33"/>
    <rect x="24" y="188" width="210" height="6" rx="3" fill="#3c4a33"/>
    <text class="mono" x="24" y="272" fill="#b8bb26">&gt;</text>

    <!-- divider -->
    <line x1="371" y1="38" x2="371" y2="290" stroke="#504945"/>

    <!-- right top: idle -->
    <line x1="372" y1="54" x2="710" y2="54" stroke="#504945"/>
    <rect x="378" y="46" width="72" height="16" fill="#282828"/>
    <circle cx="388" cy="54" r="4" fill="none" stroke="#b8bb26" stroke-width="1.6"/>
    <text class="mono" x="398" y="58" fill="#ebdbb2">claude</text>
    <rect x="386" y="76" width="240" height="6" rx="3" fill="#3c3836"/>
    <rect x="386" y="92" width="170" height="6" rx="3" fill="#3c3836"/>
    <rect x="386" y="108" width="270" height="6" rx="3" fill="#3c3836"/>
    <text class="mono" x="386" y="150" fill="#a89984">&gt;</text>

    <!-- right bottom: no Claude -->
    <line x1="372" y1="166" x2="710" y2="166" stroke="#504945"/>
    <rect x="378" y="158" width="64" height="16" fill="#282828"/>
    <circle cx="388" cy="166" r="4.5" fill="#83a598"/>
    <text class="mono" x="398" y="170" fill="#ebdbb2">shell</text>
    <rect x="386" y="188" width="200" height="6" rx="3" fill="#3c3836"/>
    <rect x="386" y="204" width="120" height="6" rx="3" fill="#3c3836"/>
    <text class="mono" x="386" y="240" fill="#a89984">$</text>
  </g>
  <rect x="10" y="10" width="700" height="280" rx="10" fill="none" stroke="#504945"/>
</svg>
